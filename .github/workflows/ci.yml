name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Syntax check server
        run: for f in server/*.js; do node --check "$f"; done
      - name: Smoke test
        run: |
          DATA_DIR=$RUNNER_TEMP/data PORT=8080 npm start &
          for i in $(seq 1 20); do curl -fs http://localhost:8080/api/health && break; sleep 1; done
          curl -fs http://localhost:8080/api/health
          curl -fs http://localhost:8080/staff | grep -q '<div id="root">'
      - name: Docker image builds
        run: docker build -t twisted-cafe:ci .
